<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>机场定位交互验证</title>
<link rel="stylesheet" href="http://127.0.0.1:9000/UAVIP/lib/Cesium/Widgets/widgets.css">
<script src="http://127.0.0.1:9000/UAVIP/config/urlConfig.js"></script>
<script src="http://127.0.0.1:9000/UAVIP/lib/Cesium/Cesium.js"></script>
<style>html,body,#map{width:100%;height:100%;margin:0}body{font-family:sans-serif}header{position:absolute;z-index:2;top:16px;left:16px;color:white;background:#123f43;padding:16px;border-radius:8px}button{margin:8px 8px 0 0;padding:9px;cursor:pointer}</style>
</head><body><header>机场定位交互验证 · 模拟数据（不会调用飞行接口）<br>
<button id="all">显示同名机场（在线 / 离线）</button><button id="one">单机场定位</button><button id="clear">清除定位</button></header><div id="map"></div>
<script type="module">
import { renderAirportFocus } from 'http://127.0.0.1:9000/UAVIP/src/services/airportFocus.ts';
const C = window.Cesium;
const viewer = new C.Viewer('map', {animation:false,timeline:false,geocoder:false,homeButton:false,baseLayerPicker:false,sceneModePicker:false,navigationHelpButton:false,infoBox:false,selectionIndicator:false,imageryProvider:false});
viewer.imageryLayers.addImageryProvider(new C.GridImageryProvider({cells:8,color:C.Color.CYAN.withAlpha(0.2),backgroundColor:C.Color.fromCssColorString('#123437')}));
const points = [
 {deviceSn:'preview-online',name:'示例同名机场',longitude:113.9,latitude:29.7,onlineStatus:1},
 {deviceSn:'preview-offline',name:'示例同名机场',longitude:113.902,latitude:29.702,onlineStatus:0},
];
document.querySelector('#all').onclick = () => renderAirportFocus(viewer,C,points);
document.querySelector('#one').onclick = () => renderAirportFocus(viewer,C,[points[0]]);
document.querySelector('#clear').onclick = () => renderAirportFocus(viewer,C,[]);
renderAirportFocus(viewer,C,points);
</script></body></html>
